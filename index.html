<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한나목장 주간보고서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --forest:#2D5016;--forest-m:#3D6B20;--forest-l:#4E8A2A;
  --sage:#7BA05B;--sage-l:#A8C882;
  --cream:#F8F4EC;--cream-d:#EDE8DC;--parchment:#F2EDE0;
  --ink:#1C1C1A;--ink-s:#3A3A36;--ink-m:#6B6B62;--ink-f:#9B9B8E;
  --gold:#C8922A;--teal:#1D9E75;--teal-l:#E1F5EE;
  --blue-s:#D5E5F5;--red-s:#F5E0E0;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 20%,rgba(78,138,42,.05) 0%,transparent 50%),radial-gradient(ellipse at 85% 80%,rgba(200,146,42,.04) 0%,transparent 50%);pointer-events:none;z-index:0;}

/* ─ header ─ */
.site-hdr{background:var(--forest);color:#fff;padding:0 1.5rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.2);}
.hdr-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:54px;gap:12px;}
.logo{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;}
.logo-cross{opacity:.6;font-size:13px;}
.nav-tabs{display:flex;gap:2px;}
.nav-tab{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.6);transition:all .15s;font-family:'Noto Sans KR',sans-serif;}
.nav-tab:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-tab.active{background:rgba(255,255,255,.18);color:#fff;}
.hdr-today{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;}

/* ─ main ─ */
.main{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 5rem;position:relative;z-index:1;}

/* ─ verse card ─ */
.verse-card{background:linear-gradient(135deg,var(--forest) 0%,var(--forest-m) 60%,var(--forest-l) 100%);border-radius:16px;padding:1.5rem 2rem;color:#fff;margin-bottom:1.25rem;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(45,80,22,.25);}
.verse-card::before{content:'✝';position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);font-size:72px;opacity:.06;}
.verse-week{font-size:11px;opacity:.6;letter-spacing:.1em;margin-bottom:5px;}
.verse-ref-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.verse-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;}
.verse-prog{font-size:11px;opacity:.5;}
.verse-text{font-size:14px;opacity:.88;line-height:1.75;font-family:'Noto Serif KR',serif;font-style:italic;}
.verse-text::before{content:'"';}
.verse-text::after{content:'"';}
.verse-edit-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.verse-edit-label{font-size:11px;opacity:.6;white-space:nowrap;}
.verse-edit-input{font-size:13px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;color:#fff;outline:none;width:120px;font-family:'Noto Sans KR',sans-serif;}
.verse-edit-input::placeholder{color:rgba(255,255,255,.4);}
.verse-edit-input:focus{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);}
.verse-edit-hint{font-size:11px;opacity:.45;}

/* ─ week nav ─ */
.week-nav{background:#fff;border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1.25rem;box-shadow:0 1px 6px rgba(0,0,0,.05);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.week-nav-lbl{font-size:11px;color:var(--ink-f);font-weight:500;white-space:nowrap;}
.week-chips{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.w-chip{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid #E0DDD4;background:var(--cream);color:var(--ink-m);cursor:pointer;transition:all .12s;white-space:nowrap;}
.w-chip:hover{border-color:var(--sage);color:var(--forest-m);}
.w-chip.on{background:var(--forest);border-color:var(--forest);color:#fff;}
.w-chip.has{border-color:var(--sage);color:var(--forest-m);}

/* ─ report grid ─ */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-bottom:1rem;}
.m-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);transition:box-shadow .2s;}
.m-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.1);}
.m-head{padding:11px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(0,0,0,.05);}
.m-av{width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.m-name{font-size:14px;font-weight:600;flex:1;}
.chk-btn{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Noto Sans KR',sans-serif;}
.chk-on{background:var(--teal-l);color:var(--teal);}
.chk-off{background:#F5F5F0;color:var(--ink-f);}
.m-body{padding:13px 15px;display:flex;flex-direction:column;gap:9px;}
.f-lbl{font-size:10px;font-weight:600;color:var(--ink-f);letter-spacing:.06em;margin-bottom:4px;}
.f-lbl.teal::before,.f-lbl.gold::before,.f-lbl.sage::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;margin-right:5px;vertical-align:2px;}
.f-lbl.teal::before{background:var(--teal);}
.f-lbl.gold::before{background:var(--gold);}
.f-lbl.sage::before{background:var(--sage);}
.b-row{display:flex;gap:5px;align-items:center;margin-bottom:3px;}
.b-num{font-size:11px;color:var(--ink-f);width:14px;text-align:center;flex-shrink:0;}
.b-row select{flex:1;font-size:12px;padding:5px 6px;border:1px solid #E4E0D6;border-radius:7px;background:#FAFAF5;color:var(--ink);outline:none;font-family:'Noto Sans KR',sans-serif;}
.b-row select:focus{border-color:var(--sage);}
.b-row input{width:88px;font-size:12px;padding:5px 6px;border:1px solid #E4E0D6;border-radius:7px;background:#FFFEF8;color:var(--ink);outline:none;font-family:'Noto Sans KR',sans-serif;}
.b-row input:focus{border-color:var(--sage);}
.b-row input::placeholder{color:#C8C4B8;}
textarea.ta{width:100%;font-size:12px;padding:7px 9px;border:1px solid #E4E0D6;border-radius:8px;background:#FAFAF8;color:var(--ink);outline:none;resize:none;line-height:1.7;font-family:'Noto Sans KR',sans-serif;transition:border-color .15s;}
textarea.ta:focus{border-color:var(--sage);background:#fff;}
textarea.ta::placeholder{color:#C8C4B8;}

/* ─ common sections ─ */
.memo-sec{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:1rem;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.sec-t{font-size:11px;font-weight:600;color:var(--ink-f);letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.sec-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);display:inline-block;}
.save-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.save-info{font-size:11px;color:var(--ink-f);}
.btn-row{display:flex;align-items:center;gap:7px;}
.save-msg{font-size:12px;color:var(--teal);font-weight:500;opacity:0;transition:opacity .3s;}
.save-msg.show{opacity:1;}
.btn-primary{padding:8px 22px;border-radius:8px;background:var(--forest);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;box-shadow:0 2px 8px rgba(45,80,22,.22);}
.btn-primary:hover{background:var(--forest-l);transform:translateY(-1px);}
.btn-sec{padding:8px 16px;border-radius:8px;background:transparent;color:var(--forest-m);border:1px solid var(--sage-l);font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.btn-sec:hover{background:#EBF3D8;}

/* ─ summary table ─ */
.sum-wrap{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.sum-table{width:100%;border-collapse:collapse;font-size:11px;min-width:600px;}
.sum-table thead th{padding:9px 9px;text-align:center;font-weight:600;font-size:11px;color:#fff;background:var(--forest);border-bottom:2px solid var(--forest-l);white-space:nowrap;}
.sum-table thead th.mhd{background:var(--forest-m);}
.sum-table td{padding:7px 9px;border-bottom:1px solid #F0EDE4;vertical-align:middle;text-align:center;}
.sum-table tr:hover td{background:var(--parchment);}
.sum-table tr.cur td{background:var(--teal-l)!important;}
.tlink{color:var(--forest-m);font-weight:600;cursor:pointer;text-decoration:underline;}
.co{color:var(--teal);font-size:13px;font-weight:700;}
.cx{color:#CCC;}
.total-tr td{background:#EBF3D8!important;font-weight:700;color:var(--forest);}

/* ─ personal ─ */
.pers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
.p-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.p-head{padding:11px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(0,0,0,.05);}
.p-stat{display:flex;align-items:baseline;gap:6px;padding:10px 15px;border-bottom:1px solid #F0EDE4;}
.p-num{font-size:22px;font-weight:600;color:var(--teal);}
.p-sub{font-size:11px;color:var(--ink-f);line-height:1.5;}
.p-range{font-size:12px;color:var(--forest-m);padding:7px 15px;border-bottom:1px solid #F0EDE4;font-weight:500;}
.p-list-hd{padding:5px 15px;font-size:10px;font-weight:600;color:var(--ink-f);letter-spacing:.06em;border-bottom:1px solid #F0EDE4;}
.p-list{padding:8px 15px;max-height:200px;overflow-y:auto;}
.p-item{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #F5F3EE;font-size:11px;}
.p-item:last-child{border-bottom:none;}
.p-date{color:var(--forest-m);cursor:pointer;text-decoration:underline;white-space:nowrap;flex-shrink:0;}
.p-bible{color:var(--ink-s);flex:1;}

/* ─ member mgmt ─ */
.mgmt-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05);max-width:460px;}
.mgmt-row{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid #F0EDE4;}
.mgmt-row:last-child{border-bottom:none;}
.mgmt-num{font-size:11px;color:var(--ink-f);width:20px;text-align:center;}
.mgmt-inp{flex:1;font-size:13px;padding:5px 8px;border:1px solid #E4E0D6;border-radius:7px;outline:none;font-family:'Noto Sans KR',sans-serif;background:#FAFAF5;color:var(--ink);}
.mgmt-inp:focus{border-color:var(--sage);}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;}
.tag-fix{background:#EBF3D8;color:var(--forest-m);}
.tag-sp{background:#F5F5F0;color:var(--ink-f);}
.del-btn{font-size:16px;color:#CCC;cursor:pointer;border:none;background:none;transition:color .1s;line-height:1;}
.del-btn:hover{color:#E88;}
.add-member-btn{width:100%;padding:10px;border:1.5px dashed #D4D0C4;border-radius:10px;background:none;cursor:pointer;font-size:13px;color:var(--ink-f);margin-top:10px;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.add-member-btn:hover{border-color:var(--sage);color:var(--forest-m);background:#EBF3D8;}

/* ─ print ─ */
@media print{
  .site-hdr,.week-nav,.save-bar,.btn-sec,.btn-primary,.verse-edit-row{display:none!important;}
  body{background:#fff;}
  .verse-card{box-shadow:none;border:2px solid var(--forest);}
  .m-card{box-shadow:none;border:1px solid #DDD;break-inside:avoid;}
  .report-grid{grid-template-columns:1fr 1fr;}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.fade{animation:fadeIn .25s ease forwards;}
</style>
</head>
<body>

<header class="site-hdr">
  <div class="hdr-inner">
    <div class="logo"><span class="logo-cross">✝</span> 한나목장 주간보고서</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('weekly',this)">주간 보고서</button>
      <button class="nav-tab" onclick="switchTab('summary',this)">주차별 총괄</button>
      <button class="nav-tab" onclick="switchTab('personal',this)">개인별 총괄</button>
      <button class="nav-tab" onclick="switchTab('members',this)">멤버 관리</button>
    </div>
    <div class="hdr-today" id="hdr-today"></div>
  </div>
</header>

<main class="main">

  <!-- 암송 카드 -->
  <div class="verse-card">
    <div class="verse-week" id="verse-week"></div>
    <div class="verse-ref-row">
      <span class="verse-badge" id="verse-badge"></span>
      <span class="verse-prog" id="verse-prog"></span>
    </div>
    <div class="verse-text" id="verse-text"></div>
    <div class="verse-edit-row">
      <span class="verse-edit-label">암송절 직접 입력:</span>
      <input class="verse-edit-input" id="verse-inp" placeholder="예: 요 1:7" oninput="onVerseEdit(this.value)">
      <span class="verse-edit-hint">비우면 날짜 자동 계산</span>
    </div>
  </div>

  <!-- 주차 탭 -->
  <div class="week-nav">
    <span class="week-nav-lbl">주차 선택</span>
    <div class="week-chips" id="week-chips"></div>
  </div>

  <!-- 주간 보고서 -->
  <div id="tab-weekly">
    <div class="report-grid" id="report-grid"></div>
    <div class="memo-sec">
      <div class="sec-t"><span class="sec-dot"></span> 리더 메모</div>
      <textarea class="ta" id="memo-ta" rows="3" placeholder="다음 주 준비사항, 개인 메모 등..." oninput="getCur().memo=this.value"></textarea>
    </div>
    <div class="save-bar">
      <span class="save-info" id="save-info"></span>
      <div class="btn-row">
        <span class="save-msg" id="save-msg">저장됐어요 ✓</span>
        <button class="btn-sec" onclick="window.print()">🖨 인쇄 / PDF</button>
        <button class="btn-primary" onclick="doSave()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 주차별 총괄 -->
  <div id="tab-summary" style="display:none">
    <div class="sum-wrap"><table class="sum-table" id="sum-table"></table></div>
  </div>

  <!-- 개인별 총괄 -->
  <div id="tab-personal" style="display:none">
    <div class="pers-grid" id="pers-grid"></div>
  </div>

  <!-- 멤버 관리 -->
  <div id="tab-members" style="display:none">
    <div class="mgmt-card" id="mgmt-list"></div>
    <button class="add-member-btn" onclick="addMember()">+ 여분 멤버 추가</button>
  </div>

</main>

<script>
// ══ 데이터 ══════════════════════════════════════════
const BOOKS=["창세기","출애굽기","레위기","민수기","신명기","여호수아","사사기","룻기","사무엘상","사무엘하","열왕기상","열왕기하","역대상","역대하","에스라","느헤미야","에스더","욥기","시편","잠언","전도서","아가","이사야","예레미야","예레미야애가","에스겔","다니엘","호세아","요엘","아모스","오바댜","요나","미가","나훔","하박국","스바냐","학개","스가랴","말라기","마태복음","마가복음","누가복음","요한복음","사도행전","로마서","고린도전서","고린도후서","갈라디아서","에베소서","빌립보서","골로새서","데살로니가전서","데살로니가후서","디모데전서","디모데후서","디도서","빌레몬서","히브리서","야고보서","베드로전서","베드로후서","요한일서","요한이서","요한삼서","유다서","요한계시록"];

const JN=[
  [1,4,"그 안에 생명이 있었으니 이 생명은 사람들의 빛이라"],
  [1,5,"빛이 어둠에 비치되 어둠이 깨닫지 못하더라"],
  [1,6,"하나님께로부터 보내심을 받은 사람이 있으니 그의 이름은 요한이라"],
  [1,7,"그가 증언하러 왔으니 곧 빛에 대하여 증언하고 모든 사람이 자기로 말미암아 믿게 하려 함이라"],
  [1,8,"그는 이 빛이 아니요 이 빛에 대하여 증언하러 온 자라"],
  [1,9,"참 빛 곧 세상에 와서 각 사람에게 비추는 빛이 있었나니"],
  [1,10,"그가 세상에 계셨으며 세상은 그로 말미암아 지은 바 되었으되 세상이 그를 알지 못하였고"],
  [1,11,"자기 땅에 오매 자기 백성이 영접하지 아니하였으나"],
  [1,12,"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니"],
  [1,13,"이는 혈통으로나 육정으로나 사람의 뜻으로 나지 아니하고 오직 하나님께로부터 난 자들이니라"],
  [1,14,"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요"],
  [1,15,"요한이 그에 대하여 증언하여 외쳐 이르되 내가 전에 말하기를 내 뒤에 오시는 이가 나보다 앞선 것은 나보다 먼저 계심이라"],
  [1,16,"우리가 다 그의 충만한 데서 받으니 은혜 위에 은혜러라"],
  [1,17,"율법은 모세로 말미암아 주어진 것이요 은혜와 진리는 예수 그리스도로 말미암아 온 것이라"],
  [1,18,"본래 하나님을 본 사람이 없으되 아버지 품 속에 있는 독생하신 하나님이 나타내셨느니라"],
  [1,19,"유대인들이 예루살렘에서 제사장들과 레위인들을 요한에게 보내어 네가 누구냐 물을 때에"],
  [1,20,"요한이 드러내어 말하고 숨기지 아니하니 나는 그리스도가 아니라 하매"],
  [1,21,"또 묻되 그러면 누구냐 네가 엘리야냐 이르되 나는 아니라"],
  [1,22,"또 말하되 누구냐 우리를 보낸 이들에게 대답하게 하라 너는 네 자신을 무엇이라 하느냐"],
  [1,23,"이르되 나는 주의 길을 곧게 하라고 광야에서 외치는 자의 소리로라"],
  [1,24,"그들은 바리새인들이 보낸 자라"],
  [1,25,"또 물어 이르되 네가 그리스도도 아니요 엘리야도 아니요 그 선지자도 아닐진대 어찌하여 세례를 베푸느냐"],
  [1,26,"요한이 대답하되 나는 물로 세례를 베풀거니와 너희 가운데 너희가 알지 못하는 한 사람이 섰으니"],
  [1,27,"곧 내 뒤에 오시는 그이라 나는 그의 신발끈을 풀기도 감당하지 못하겠노라"],
  [1,28,"이 일은 요단 강 건너편 베다니에서 일어난 일이니라"],
  [1,29,"보라 세상 죄를 지고 가는 하나님의 어린 양이로다"],
  [1,30,"내가 전에 말하기를 내 뒤에 오는 사람이 있는데 나보다 앞선 것은 그가 나보다 먼저 계심이라"],
  [1,31,"나도 그를 알지 못하였으나 내가 와서 물로 세례를 베푸는 것은 그를 이스라엘에게 나타내려 함이라"],
  [1,32,"요한이 또 증언하여 이르되 성령이 비둘기 같이 하늘로부터 내려와서 그의 위에 머물렀더라"],
  [1,33,"나도 그를 알지 못하였으나 성령이 내려서 누구 위에든지 머무는 것을 보거든 그가 곧 성령으로 세례를 베푸는 이인 줄 알라"],
  [1,34,"내가 보고 그가 하나님의 아들이심을 증언하였노라"],
  [1,35,"또 이튿날 요한이 자기 제자 중 두 사람과 함께 섰다가"],
  [1,36,"예수께서 거니심을 보고 말하되 보라 하나님의 어린 양이로다"],
  [1,37,"두 제자가 그의 말을 듣고 예수를 따르거늘"],
  [1,38,"예수께서 돌이켜 그 따르는 것을 보시고 물어 이르시되 무엇을 구하느냐"],
  [1,39,"예수께서 이르시되 와서 보라 그러므로 그들이 가서 계신 데를 보고 그 날 함께 거하니"],
  [1,40,"요한의 말을 듣고 예수를 따르는 두 사람 중의 하나는 시몬 베드로의 형제 안드레라"],
];

const AVC=[
  {bg:'#EAF3DE',fg:'#3B6D11'},{bg:'#DFF0E8',fg:'#0F6E56'},
  {bg:'#FAEEDA',fg:'#854F0B'},{bg:'#FAECE7',fg:'#993C1D'},
  {bg:'#E6F1FB',fg:'#185FA5'},{bg:'#EEEDFE',fg:'#534AB7'},
  {bg:'#F1EFE8',fg:'#5F5E5A'},
];

// ══ 스케줄 ══════════════════════════════════════════
function buildSC(){
  const start=new Date(2026,3,23),end=new Date(2026,11,31),sc=[];
  let d=new Date(start),vi=0;
  while(d<=end&&vi<JN.length){
    const mo=d.getMonth()+1,day=d.getDate();
    let nth=0;for(let i=1;i<=day;i++){if(new Date(2026,d.getMonth(),i).getDay()===4)nth++;}
    sc.push({wi:vi,date:`${String(mo).padStart(2,'0')}/${String(day).padStart(2,'0')}`,
      mo,day,ref:`요 ${JN[vi][0]}:${JN[vi][1]}`,text:JN[vi][2],
      wlabel:`${mo}월 ${nth}주차`,ts:+d});
    d.setDate(d.getDate()+7);vi++;
  }
  return sc;
}
const SC=buildSC();

function getTodayWk(){
  const today=+new Date();
  let best=0;
  for(let i=0;i<SC.length;i++){if(SC[i].ts<=today)best=i;else break;}
  return best;
}

// ══ 저장소 ══════════════════════════════════════════
function ld(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let members=ld('hanna_mb')||['제현주','김은경','이은실','강자옥','송연민'];
let reports=ld('hanna_rp')||{};
let customRefs=ld('hanna_cr')||{};
let curWk=ld('hanna_cw')??getTodayWk();

function getReport(wi){
  if(!reports[wi])reports[wi]={members:members.map(()=>mDef()),memo:''};
  while(reports[wi].members.length<members.length)reports[wi].members.push(mDef());
  return reports[wi];
}
function mDef(){return{check:false,b1:'',b1r:'',b2:'',b2r:'',b3:'',b3r:'',shaum:'',pray:''};}
function getCur(){return getReport(curWk);}

function saveAll(){sv('hanna_rp',reports);sv('hanna_mb',members);sv('hanna_cw',curWk);sv('hanna_cr',customRefs);}

// ══ 암송절 ══════════════════════════════════════════
function getVerse(wi){
  const cr=customRefs[wi];
  if(cr){
    const m=cr.match(/요\s*(\d+):(\d+)/);
    if(m){const f=JN.find(j=>j[0]==+m[1]&&j[1]==+m[2]);if(f)return{ref:cr,text:f[2]};}
    return{ref:cr,text:'(요한복음 구절을 찾을 수 없어요. 예: 요 1:6)'};
  }
  const s=SC[wi];return{ref:s.ref,text:s.text};
}

function onVerseEdit(val){
  val=val.trim();
  if(val)customRefs[curWk]=val;else delete customRefs[curWk];
  sv('hanna_cr',customRefs);
  renderVerseCard();renderChips();
}

// ══ 렌더 ════════════════════════════════════════════
function renderHeader(){
  const today=new Date();
  const s=SC[curWk];
  document.getElementById('hdr-today').textContent=
    `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 · 이번 암송: ${getVerse(curWk).ref}`;
}

function renderVerseCard(){
  const s=SC[curWk];const v=getVerse(curWk);
  document.getElementById('verse-week').textContent=`${s.wlabel} · ${s.wi+1}주차`;
  document.getElementById('verse-badge').textContent=`암송 · ${v.ref}`;
  document.getElementById('verse-prog').textContent=`${curWk+1} / ${SC.length}주`;
  document.getElementById('verse-text').textContent=v.text;
  const inp=document.getElementById('verse-inp');
  inp.value=customRefs[curWk]||'';
  inp.placeholder=`기본: ${s.ref}`;
}

function renderChips(){
  const c=document.getElementById('week-chips');c.innerHTML='';
  SC.forEach((s,i)=>{
    const r=reports[i];const has=r&&r.members&&r.members.some(m=>m.shaum||m.b1);
    const btn=document.createElement('button');
    btn.className='w-chip'+(i===curWk?' on':'')+(has&&i!==curWk?' has':'');
    btn.textContent=s.date;
    btn.title=`${s.wlabel} · ${getVerse(i).ref}`;
    btn.onclick=()=>{curWk=i;sv('hanna_cw',i);renderAll();};
    c.appendChild(btn);
  });
}

function mkSel(val,cb){
  const s=document.createElement('select');
  const b=document.createElement('option');b.value='';b.textContent='성경 선택';s.appendChild(b);
  BOOKS.forEach(bk=>{
    const o=document.createElement('option');o.value=bk;o.textContent=bk;
    if(bk===val)o.selected=true;s.appendChild(o);
  });
  s.onchange=e=>cb(e.target.value);return s;
}

function renderReportGrid(){
  const g=document.getElementById('report-grid');g.innerHTML='';
  const r=getCur();
  members.forEach((name,mi)=>{
    const ac=AVC[mi%AVC.length];const md=r.members[mi];
    const card=document.createElement('div');card.className='m-card fade';
    card.style.animationDelay=`${mi*.05}s`;

    // head
    const hd=document.createElement('div');hd.className='m-head';hd.style.background=ac.bg;
    const av=document.createElement('div');av.className='m-av';
    av.style.background=ac.fg;av.style.color='#fff';av.textContent=name[0];
    const nm=document.createElement('span');nm.className='m-name';nm.style.color=ac.fg;nm.textContent=name;
    const chk=document.createElement('button');
    const setChk=()=>{chk.className='chk-btn '+(md.check?'chk-on':'chk-off');chk.textContent=md.check?'✓ 암송 완료':'암송 미완';};
    setChk();chk.onclick=()=>{md.check=!md.check;setChk();};
    hd.append(av,nm,chk);card.appendChild(hd);

    const body=document.createElement('div');body.className='m-body';

    // 성경읽기
    const bg=document.createElement('div');
    bg.innerHTML='<div class="f-lbl sage">이번 주 읽은 성경</div>';
    [['b1','b1r','①'],['b2','b2r','②'],['b3','b3r','③']].forEach(([bk,br,num])=>{
      const row=document.createElement('div');row.className='b-row';
      const ns=document.createElement('span');ns.className='b-num';ns.textContent=num;
      const sel=mkSel(md[bk],v=>{md[bk]=v;});
      const inp=document.createElement('input');
      inp.placeholder='장절 범위';inp.value=md[br]||'';
      inp.oninput=e=>{md[br]=e.target.value;};
      row.append(ns,sel,inp);bg.appendChild(row);
    });
    body.appendChild(bg);

    // 나눔
    const sg=document.createElement('div');
    sg.innerHTML='<div class="f-lbl teal">이번 주 나눔 · 말씀과 삶</div>';
    const sta=document.createElement('textarea');sta.className='ta';sta.rows=4;
    sta.placeholder='말씀 나눔, 삶의 적용을 자유롭게 적어주세요...';
    sta.value=md.shaum||'';sta.oninput=e=>{md.shaum=e.target.value;};
    sg.appendChild(sta);body.appendChild(sg);

    // 기도
    const pg=document.createElement('div');
    pg.innerHTML='<div class="f-lbl gold">기도 제목</div>';
    const pta=document.createElement('textarea');pta.className='ta';pta.rows=3;
    pta.placeholder='기도 제목을 적어주세요...';
    pta.value=md.pray||'';pta.oninput=e=>{md.pray=e.target.value;};
    pg.appendChild(pta);body.appendChild(pg);

    card.appendChild(body);g.appendChild(card);
  });

  document.getElementById('memo-ta').value=getCur().memo||'';
  const saved=Object.keys(reports).filter(k=>reports[k]?.members?.some(m=>m.shaum||m.b1)).length;
  document.getElementById('save-info').textContent=`${saved}개 주차 기록 보관 중`;
}

function doSave(){
  saveAll();
  const msg=document.getElementById('save-msg');
  msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),2000);
  renderChips();renderSummary();renderPersonal();
}

// ── 주차별 총괄 ──────────────────────────────────────
function renderSummary(){
  const N=members.length;
  let h=`<thead><tr><th>No</th><th>날짜</th><th>암송절</th>`;
  members.forEach(m=>h+=`<th class="mhd">${m}</th>`);
  h+=`</tr></thead><tbody>`;
  const tots=members.map(()=>0);
  SC.forEach((s,wi)=>{
    const r=reports[wi];const isCur=wi===curWk;
    h+=`<tr class="${isCur?'cur':''}">
      <td style="color:#aaa;font-size:10px">${wi+1}</td>
      <td><span class="tlink" onclick="goWk(${wi})">${s.date}<br><small style="color:#aaa">${s.wlabel}</small></span></td>
      <td style="color:#2C4A2C;font-weight:600;font-size:11px">${getVerse(wi).ref}</td>`;
    members.forEach((m,mi)=>{
      const md=r?.members?.[mi];
      if(md?.check)tots[mi]++;
      h+=`<td class="${md?.check?'co':'cx'}">${md?.check?'O':'—'}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`<tr class="total-tr"><td colspan="3" style="text-align:center">암송 완료 집계</td>`;
  tots.forEach(t=>h+=`<td style="color:var(--teal);font-size:14px;font-weight:700">${t}<small style="font-size:10px;color:#888"> 회</small></td>`);
  h+=`</tr></tbody>`;
  document.getElementById('sum-table').innerHTML=h;
}

// ── 개인별 총괄 ──────────────────────────────────────
function renderPersonal(){
  const g=document.getElementById('pers-grid');g.innerHTML='';
  members.forEach((name,mi)=>{
    const ac=AVC[mi%AVC.length];
    let cnt=0,lastRef='';
    const items=[];
    SC.forEach((s,wi)=>{
      const md=reports[wi]?.members?.[mi];
      if(md?.check){cnt++;lastRef=getVerse(wi).ref;}
      const parts=[md?.b1?(md.b1+(md.b1r?' '+md.b1r:'')):'',
                   md?.b2?(md.b2+(md.b2r?' '+md.b2r:'')):'',
                   md?.b3?(md.b3+(md.b3r?' '+md.b3r:'')):''].filter(Boolean);
      if(parts.length)items.push({wi,date:s.date,text:parts.join(' / ')});
    });
    const range=cnt>0?`요 1:4 ~ ${lastRef}`:'아직 없음';
    const card=document.createElement('div');card.className='p-card';
    card.innerHTML=`
      <div class="p-head" style="background:${ac.bg}">
        <div class="m-av" style="background:${ac.fg};color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">${name[0]}</div>
        <span style="font-size:14px;font-weight:600;color:${ac.fg}">${name}</span>
      </div>
      <div class="p-stat">
        <span class="p-num">${cnt}</span>
        <span class="p-sub">회 암송 완료<br>${SC.length}주 중</span>
      </div>
      <div class="p-range">${range}</div>
      <div class="p-list-hd">읽은 성경 누적</div>
      <div class="p-list">${items.length?items.map(it=>`
        <div class="p-item">
          <span class="p-date" onclick="goWk(${it.wi})">${it.date}</span>
          <span class="p-bible">${it.text}</span>
        </div>`).join(''):'<div style="color:#C8C4B8;font-size:12px;padding:6px 0">아직 입력된 내용이 없어요</div>'}
      </div>`;
    g.appendChild(card);
  });
}

// ── 멤버 관리 ─────────────────────────────────────────
function renderMgmt(){
  const list=document.getElementById('mgmt-list');list.innerHTML='';
  members.forEach((name,mi)=>{
    const ac=AVC[mi%AVC.length];const fixed=mi<5;
    const row=document.createElement('div');row.className='mgmt-row';
    const num=document.createElement('span');num.className='mgmt-num';
    num.style.color=ac.fg;num.textContent=mi+1;
    row.appendChild(num);
    if(fixed){
      const nm=document.createElement('span');
      nm.style.cssText='flex:1;font-size:13px;font-weight:500;color:var(--ink)';nm.textContent=name;
      const tag=document.createElement('span');tag.className='tag tag-fix';tag.textContent='고정';
      row.append(nm,tag);
    } else {
      const inp=document.createElement('input');inp.className='mgmt-inp';inp.value=name;
      inp.onchange=e=>{members[mi]=e.target.value;saveAll();renderMgmt();renderAll();};
      const tag=document.createElement('span');tag.className='tag tag-sp';tag.textContent='여분';
      const del=document.createElement('button');del.className='del-btn';del.textContent='×';
      del.onclick=()=>{
        if(!confirm(`"${members[mi]}"을 삭제할까요?`))return;
        members.splice(mi,1);
        Object.keys(reports).forEach(k=>{if(reports[k]?.members)reports[k].members.splice(mi,1);});
        saveAll();renderMgmt();renderAll();
      };
      row.append(inp,tag,del);
    }
    list.appendChild(row);
  });
}

function addMember(){
  members.push('새 멤버');saveAll();renderMgmt();renderAll();
}

function goWk(wi){
  curWk=wi;sv('hanna_cw',wi);
  switchTab('weekly',document.querySelector('.nav-tab'));
  renderAll();
}

// ── 탭 전환 ──────────────────────────────────────────
function switchTab(name,btn){
  ['weekly','summary','personal','members'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===name?'':'none';
  });
  document.querySelectorAll('.nav-tab').forEach((b,i)=>{
    b.classList.toggle('active',['weekly','summary','personal','members'][i]===name);
  });
  if(name==='summary')renderSummary();
  if(name==='personal')renderPersonal();
  if(name==='members')renderMgmt();
}

// ── 전체 렌더 ─────────────────────────────────────────
function renderAll(){
  renderHeader();renderVerseCard();renderChips();renderReportGrid();
}

renderAll();
</script>
</body>
</html>
