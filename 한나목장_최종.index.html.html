<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>한나목장 주간보고서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ────────────────────────────────────────────────────
// ★★★ 여기에 Firebase 설정을 붙여넣으세요 ★★★
// 아래 단계를 따라 설정값을 얻으세요:
// 1. https://console.firebase.google.com 접속
// 2. 새 프로젝트 만들기 (예: hanna-mokjang)
// 3. 왼쪽 메뉴 → Firestore Database → 만들기 (테스트 모드)
// 4. 프로젝트 설정(⚙️) → 앱 추가(</>) → 웹앱 등록
// 5. 아래 firebaseConfig 값 교체
// ────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);

const GROUP_ID = 'hanna2026'; // 여러 셀이 있으면 이 값을 다르게

// ── Firestore 저장/불러오기 헬퍼 ─────────────────────
async function dbGet(docId) {
  const snap = await getDoc(doc(db, GROUP_ID, docId));
  return snap.exists() ? snap.data() : null;
}
async function dbSet(docId, data) {
  await setDoc(doc(db, GROUP_ID, docId), data, { merge: true });
}

// ── 실시간 동기화: reports 문서 변경 감지 ────────────
function listenReports(onChange) {
  return onSnapshot(doc(db, GROUP_ID, 'reports'), snap => {
    if (snap.exists()) onChange(snap.data());
  });
}
function listenMeta(onChange) {
  return onSnapshot(doc(db, GROUP_ID, 'meta'), snap => {
    if (snap.exists()) onChange(snap.data());
  });
}

// ── 전역에 노출 ──────────────────────────────────────
window._db = { dbGet, dbSet, listenReports, listenMeta, ready: true };
window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --forest:#2D5016;--forest-m:#3D6B20;--forest-l:#4E8A2A;
  --sage:#7BA05B;--sage-l:#A8C882;
  --cream:#F8F4EC;--parchment:#F2EDE0;
  --ink:#1C1C1A;--ink-s:#3A3A36;--ink-m:#6B6B62;--ink-f:#9B9B8E;
  --gold:#C8922A;--teal:#1D9E75;--teal-l:#E1F5EE;
  --sync-green:#22C55E;--sync-orange:#F59E0B;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}

/* ── 헤더 ── */
.hdr{background:var(--forest);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.2);}
.hdr-in{max-width:1100px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:52px;gap:10px;}
.logo{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.logo-cross{opacity:.55;font-size:12px;}
.nav{display:flex;gap:2px;}
.nav-btn{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.55);font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.nav-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-btn.on{background:rgba(255,255,255,.18);color:#fff;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--sync-orange);transition:background .5s;flex-shrink:0;}
.sync-dot.ok{background:var(--sync-green);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.hdr-date{font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap;}

/* ── 알림 토스트 ── */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ── 로딩 ── */
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--ink-f);font-size:14px;gap:10px;}
.spin{width:20px;height:20px;border:2px solid #E0DDD4;border-top-color:var(--forest);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 메인 ── */
.main{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 5rem;}

/* ── verse card ── */
.verse-card{background:linear-gradient(135deg,var(--forest) 0%,var(--forest-m) 55%,var(--forest-l) 100%);border-radius:16px;padding:1.4rem 1.75rem;color:#fff;margin-bottom:1.2rem;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(45,80,22,.25);}
.verse-card::before{content:'✝';position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);font-size:68px;opacity:.06;}
.vweek{font-size:11px;opacity:.55;letter-spacing:.1em;margin-bottom:5px;}
.vref-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.vbadge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;}
.vprog{font-size:11px;opacity:.45;}
.vtext{font-size:14px;opacity:.88;line-height:1.75;font-family:'Noto Serif KR',serif;font-style:italic;}
.vtext::before{content:'"';} .vtext::after{content:'"';}
.vedit-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.vedit-lbl{font-size:11px;opacity:.55;white-space:nowrap;}
.vedit-inp{font-size:13px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;color:#fff;outline:none;width:115px;font-family:'Noto Sans KR',sans-serif;}
.vedit-inp::placeholder{color:rgba(255,255,255,.35);}
.vedit-inp:focus{background:rgba(255,255,255,.2);}
.vedit-hint{font-size:11px;opacity:.4;}

/* ── week nav ── */
.wnav{background:#fff;border-radius:12px;padding:.85rem 1.1rem;margin-bottom:1.2rem;box-shadow:0 1px 6px rgba(0,0,0,.05);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.wnav-lbl{font-size:11px;color:var(--ink-f);font-weight:500;white-space:nowrap;}
.chips{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid #E0DDD4;background:var(--cream);color:var(--ink-m);cursor:pointer;transition:all .12s;white-space:nowrap;}
.chip:hover{border-color:var(--sage);color:var(--forest-m);}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff;}
.chip.has{border-color:var(--sage);color:var(--forest-m);}

/* ── report grid ── */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:1rem;margin-bottom:1rem;}
.mcard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.mcard:hover{box-shadow:0 4px 18px rgba(0,0,0,.1);}
.mhd{padding:11px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(0,0,0,.05);}
.mav{width:31px;height:31px;border-radius:50%;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mname{font-size:14px;font-weight:600;flex:1;}
.chkbtn{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.chk-on{background:var(--teal-l);color:var(--teal);}
.chk-off{background:#F5F5F0;color:var(--ink-f);}
.mbody{padding:13px 14px;display:flex;flex-direction:column;gap:9px;}
.flbl{font-size:10px;font-weight:600;color:var(--ink-f);letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.flbl::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;}
.flbl.teal::before{background:var(--teal);}
.flbl.gold::before{background:var(--gold);}
.flbl.sage::before{background:var(--sage);}
.brow{display:flex;gap:5px;align-items:center;margin-bottom:3px;}
.bnum{font-size:11px;color:var(--ink-f);width:14px;text-align:center;flex-shrink:0;}
.brow select{flex:1;font-size:12px;padding:5px 6px;border:1px solid #E4E0D6;border-radius:7px;background:#FAFAF5;color:var(--ink);outline:none;font-family:'Noto Sans KR',sans-serif;}
.brow select:focus{border-color:var(--sage);}
.brow input{width:85px;font-size:12px;padding:5px 6px;border:1px solid #E4E0D6;border-radius:7px;background:#FFFEF8;color:var(--ink);outline:none;font-family:'Noto Sans KR',sans-serif;}
.brow input:focus{border-color:var(--sage);}
.brow input::placeholder{color:#C8C4B8;}
textarea.ta{width:100%;font-size:12px;padding:7px 9px;border:1px solid #E4E0D6;border-radius:8px;background:#FAFAF8;color:var(--ink);outline:none;resize:none;line-height:1.7;font-family:'Noto Sans KR',sans-serif;}
textarea.ta:focus{border-color:var(--sage);background:#fff;}
textarea.ta::placeholder{color:#C8C4B8;}

/* ── common ── */
.sec-box{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:1rem;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.sec-t{font-size:11px;font-weight:600;color:var(--ink-f);letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.sec-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);display:inline-block;}
.save-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.save-info{font-size:11px;color:var(--ink-f);}
.btn-row{display:flex;align-items:center;gap:7px;}
.btn-p{padding:8px 20px;border-radius:8px;background:var(--forest);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;box-shadow:0 2px 8px rgba(45,80,22,.22);transition:all .15s;}
.btn-p:hover{background:var(--forest-l);}
.btn-s{padding:8px 14px;border-radius:8px;background:transparent;color:var(--forest-m);border:1px solid var(--sage-l);font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.btn-s:hover{background:#EBF3D8;}

/* ── summary ── */
.sum-wrap{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.sum-t{width:100%;border-collapse:collapse;font-size:11px;min-width:550px;}
.sum-t thead th{padding:9px 9px;text-align:center;font-weight:600;font-size:11px;color:#fff;background:var(--forest);white-space:nowrap;}
.sum-t thead th.mh{background:var(--forest-m);}
.sum-t td{padding:7px 9px;border-bottom:1px solid #F0EDE4;text-align:center;}
.sum-t tr:hover td{background:var(--parchment);}
.sum-t tr.cur td{background:var(--teal-l)!important;}
.tlink{color:var(--forest-m);font-weight:600;cursor:pointer;text-decoration:underline;}
.co{color:var(--teal);font-size:13px;font-weight:700;}
.cx{color:#CCC;}
.tot-tr td{background:#EBF3D8!important;font-weight:700;color:var(--forest);}

/* ── personal ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1rem;}
.pcard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.phd{padding:11px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(0,0,0,.05);}
.pstat{display:flex;align-items:baseline;gap:6px;padding:10px 14px;border-bottom:1px solid #F0EDE4;}
.pnum{font-size:22px;font-weight:600;color:var(--teal);}
.psub{font-size:11px;color:var(--ink-f);line-height:1.5;}
.prange{font-size:12px;color:var(--forest-m);padding:7px 14px;border-bottom:1px solid #F0EDE4;font-weight:500;}
.plist-hd{padding:5px 14px;font-size:10px;font-weight:600;color:var(--ink-f);letter-spacing:.06em;border-bottom:1px solid #F0EDE4;}
.plist{padding:8px 14px;max-height:190px;overflow-y:auto;}
.pitem{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #F5F3EE;font-size:11px;}
.pitem:last-child{border-bottom:none;}
.pdate{color:var(--forest-m);cursor:pointer;text-decoration:underline;white-space:nowrap;flex-shrink:0;}
.pbib{color:var(--ink-s);flex:1;}

/* ── member mgmt ── */
.mgmt-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05);max-width:460px;}
.mgmt-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #F0EDE4;}
.mgmt-row:last-child{border-bottom:none;}
.mgmt-num{font-size:11px;color:var(--ink-f);width:20px;text-align:center;}
.mgmt-inp{flex:1;font-size:13px;padding:5px 8px;border:1px solid #E4E0D6;border-radius:7px;outline:none;font-family:'Noto Sans KR',sans-serif;background:#FAFAF5;color:var(--ink);}
.mgmt-inp:focus{border-color:var(--sage);}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;}
.tag-fix{background:#EBF3D8;color:var(--forest-m);}
.tag-sp{background:#F5F5F0;color:var(--ink-f);}
.del-btn{font-size:17px;color:#CCC;cursor:pointer;border:none;background:none;}
.del-btn:hover{color:#E88;}
.add-mbtn{width:100%;padding:10px;border:1.5px dashed #D4D0C4;border-radius:10px;background:none;cursor:pointer;font-size:13px;color:var(--ink-f);margin-top:10px;font-family:'Noto Sans KR',sans-serif;}
.add-mbtn:hover{border-color:var(--sage);color:var(--forest-m);background:#EBF3D8;}

/* ── 모바일 ── */
@media(max-width:600px){
  .hdr-date,.vedit-hint{display:none;}
  .nav-btn{padding:5px 8px;font-size:11px;}
  .rgrid{grid-template-columns:1fr;}
  .verse-card{padding:1.1rem 1.2rem;}
}

/* ── print ── */
@media print{
  .hdr,.wnav,.save-bar,.vedit-row,.btn-s,.btn-p{display:none!important;}
  body{background:#fff;}
  .mcard{box-shadow:none;border:1px solid #DDD;break-inside:avoid;}
  .rgrid{grid-template-columns:1fr 1fr;}
}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.fade{animation:fadeIn .25s ease forwards;}
</style>
</head>
<body>

    <div class="nav">
      <button class="nav-btn on" onclick="switchTab('weekly',this)">주간보고서</button>
      <button class="nav-btn" onclick="switchTab('summary',this)">총괄</button>
      <button class="nav-btn" onclick="switchTab('personal',this)">개인별</button>

      <div class="sync-dot" id="sync-dot" title="동기화 상태"></div>
      <div class="hdr-date" id="hdr-date"></div>

</header>

<main class="main">

  <!-- 암송 카드 -->
  <div class="verse-card">
    <div class="vweek" id="vweek"></div>
    <div class="vref-row">
      <span class="vbadge" id="vbadge"></span>
      <span class="vprog" id="vprog"></span>

      <span class="vedit-lbl">암송절 수정:</span>

  </div>

  <!-- 주차 선택 -->
  <div class="wnav">
    <span class="wnav-lbl">주차</span>

  <div id="tab-weekly">
    <div class="rgrid" id="rgrid"></div>
    <div class="sec-box">
      <div class="sec-t"><span class="sec-dot"></span> 리더 메모</div>
      <textarea class="ta" id="memo-ta" rows="3" placeholder="다음 주 준비, 개인 메모..." oninput="getCur().memo=this.value"></textarea>

    <div class="save-bar">
      <span class="save-info" id="sinfo"></span>
      <div class="btn-row">
        <button class="btn-s" onclick="window.print()">🖨 인쇄</button>
        <button class="btn-p" onclick="doSave()">저장 · 동기화</button>
      </div>
    </div>
  </div>

  <div id="tab-summary" style="display:none">
    <div class="sum-wrap"><table class="sum-t" id="sum-t"></table></div>
  </div>

  <div id="tab-personal" style="display:none">
    <div class="pgrid" id="pgrid"></div>
  </div>

  <div id="tab-members" style="display:none">
    <div class="mgmt-card" id="mgmt-list"></div>
    <button class="add-mbtn" onclick="addMember()">+ 여분 멤버 추가</button>
  </div>

</main>

// ── 스케줄 ────────────────────────────────────────────
function buildSC(){
  const start=new Date(2026,3,23),end=new Date(2026,11,31),sc=[];
  let d=new Date(start),vi=0;
  while(d<=end&&vi<JN.length){
    const mo=d.getMonth()+1,day=d.getDate();
    let nth=0;for(let i=1;i<=day;i++){if(new Date(2026,d.getMonth(),i).getDay()===4)nth++;}
    sc.push({wi:vi,date:`${String(mo).padStart(2,'0')}/${String(day).padStart(2,'0')}`,
      mo,day,ref:`요 ${JN[vi][0]}:${JN[vi][1]}`,text:JN[vi][2],
      wlabel:`${mo}월 ${nth}주차`,ts:+d});
    d.setDate(d.getDate()+7);vi++;
  }
  return sc;
}
const SC=buildSC();

function getTodayWk(){
  const today=+new Date();
  let best=0;
  for(let i=0;i<SC.length;i++){if(SC[i].ts<=today)best=i;else break;}
  return best;
}

// ── 상태 ─────────────────────────────────────────────
function ld(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let members = ld('hanna_mb')||['제현주','김은경','이은실','강자옥','송연민'];
let reports  = ld('hanna_rp')||{};
let customRefs = ld('hanna_cr')||{};
let curWk = ld('hanna_cw')??getTodayWk();

// Firebase 준비 여부
let fbReady = false;
let _db = null;

function mDef(){return{check:false,b1:'',b1r:'',b2:'',b2r:'',b3:'',b3r:'',shaum:'',pray:''};}
function getReport(wi){
  if(!reports[wi])reports[wi]={members:members.map(()=>mDef()),memo:''};
  while(reports[wi].members.length<members.length)reports[wi].members.push(mDef());
  return reports[wi];
}
function getCur(){return getReport(curWk);}

// ── 로컬 저장 ─────────────────────────────────────────
function saveLocal(){
  sv('hanna_rp',reports);sv('hanna_mb',members);
  sv('hanna_cw',curWk);sv('hanna_cr',customRefs);
}

// ── Firebase 저장 ─────────────────────────────────────
async function saveToCloud(){
  if(!fbReady){showToast('⚠️ Firebase 미설정 — 로컬에만 저장됨');return false;}
  setSyncDot('saving');
  try{
    await _db.dbSet('reports', reports);
    await _db.dbSet('meta', {members, customRefs, updatedAt: Date.now()});
    setSyncDot('ok');
    showToast('✓ 저장 완료 — 모든 기기에 동기화됨');
    return true;
  }catch(e){
    setSyncDot('err');
    showToast('⚠️ 동기화 실패: '+e.message);
    return false;
  }
}

async function doSave(){
  saveLocal();
  await saveToCloud();
  renderChips();renderSummary();renderPersonal();
}

// ── 동기화 상태 표시 ──────────────────────────────────
function setSyncDot(state){
  const dot=document.getElementById('sync-dot');
  if(state==='ok'){dot.classList.add('ok');dot.title='동기화 완료';}
  else{dot.classList.remove('ok');dot.title=state==='saving'?'저장 중...':'오류';}
}

// ── 토스트 ─────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

// ── 암송절 ────────────────────────────────────────────
function getVerse(wi){
  const cr=customRefs[wi];
  if(cr){
    const m=cr.match(/요\s*(\d+):(\d+)/);
    if(m){const f=JN.find(j=>j[0]==+m[1]&&j[1]==+m[2]);if(f)return{ref:cr,text:f[2]};}
    return{ref:cr,text:'(요한복음 구절을 찾을 수 없어요. 예: 요 1:6)'};
  }
  const s=SC[wi];return{ref:s.ref,text:s.text};
}
function onVerseEdit(val){
  val=val.trim();
  if(val)customRefs[curWk]=val;else delete customRefs[curWk];
  sv('hanna_cr',customRefs);
  renderVerseCard();renderChips();
}

function renderChips(){
  const c=document.getElementById('chips');c.innerHTML='';
  SC.forEach((s,i)=>{
    const r=reports[i];const has=r&&r.members&&r.members.some(m=>m.shaum||m.b1);

    btn.className='chip'+(i===curWk?' on':'')+(has&&i!==curWk?' has':'');
    btn.textContent=s.date;btn.title=`${s.wlabel} · ${getVerse(i).ref}`;
    btn.onclick=()=>{curWk=i;sv('hanna_cw',i);renderAll();};

function mkSel(val,cb){
  const s=document.createElement('select');
  const b=document.createElement('option');b.value='';b.textContent='성경 선택';s.appendChild(b);
  BOOKS.forEach(bk=>{
    const o=document.createElement('option');o.value=bk;o.textContent=bk;
    if(bk===val)o.selected=true;s.appendChild(o);
  });
  s.onchange=e=>cb(e.target.value);return s;
}

      const row=document.createElement('div');row.className='brow';

function renderSummary(){
  const N=members.length;
  let h=`<thead><tr><th>No</th><th>날짜</th><th>암송절</th>`;
  members.forEach(m=>h+=`<th class="mh">${m}</th>`);
  h+=`</tr></thead><tbody>`;
  const tots=members.map(()=>0);
  SC.forEach((s,wi)=>{
    const r=reports[wi];const isCur=wi===curWk;
    h+=`<tr class="${isCur?'cur':''}">
      <td style="color:#aaa;font-size:10px">${wi+1}</td>
      <td><span class="tlink" onclick="goWk(${wi})">${s.date}<br><small style="color:#aaa">${s.wlabel}</small></span></td>
      <td style="color:#2C4A2C;font-weight:600;font-size:11px">${getVerse(wi).ref}</td>`;
    members.forEach((m,mi)=>{
      const md=r?.members?.[mi];
      if(md?.check)tots[mi]++;
      h+=`<td class="${md?.check?'co':'cx'}">${md?.check?'O':'—'}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`<tr class="tot-tr"><td colspan="3" style="text-align:center">암송 집계</td>`;
  tots.forEach(t=>h+=`<td style="color:var(--teal);font-size:14px;font-weight:700">${t}<small style="font-size:10px;color:#888"> 회</small></td>`);
  h+=`</tr></tbody>`;
  document.getElementById('sum-t').innerHTML=h;
}

function renderPersonal(){
  const g=document.getElementById('pgrid');g.innerHTML='';
  members.forEach((name,mi)=>{
    const ac=AVC[mi%AVC.length];
    let cnt=0,lastRef='';const items=[];
    SC.forEach((s,wi)=>{
      const md=reports[wi]?.members?.[mi];
      if(md?.check){cnt++;lastRef=getVerse(wi).ref;}
      const parts=[md?.b1?(md.b1+(md.b1r?' '+md.b1r:'')):'',
                   md?.b2?(md.b2+(md.b2r?' '+md.b2r:'')):'',
                   md?.b3?(md.b3+(md.b3r?' '+md.b3r:'')):''].filter(Boolean);
      if(parts.length)items.push({wi,date:s.date,text:parts.join(' / ')});
    });
    const range=cnt>0?`요 1:4 ~ ${lastRef}`:'아직 없음';
    const card=document.createElement('div');card.className='pcard';
    card.innerHTML=`
      <div class="phd" style="background:${ac.bg}">
        <div class="mav" style="background:${ac.fg};color:#fff;width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">${name[0]}</div>
        <span style="font-size:14px;font-weight:600;color:${ac.fg}">${name}</span>
      </div>
      <div class="pstat"><span class="pnum">${cnt}</span><span class="psub">회 암송<br>${SC.length}주 중</span></div>
      <div class="prange">${range}</div>
      <div class="plist-hd">읽은 성경 누적</div>
      <div class="plist">${items.length?items.map(it=>`
        <div class="pitem">
          <span class="pdate" onclick="goWk(${it.wi})">${it.date}</span>
          <span class="pbib">${it.text}</span>
        </div>`).join(''):'<div style="color:#C8C4B8;font-size:12px;padding:5px 0">아직 없음</div>'}
      </div>`;
    g.appendChild(card);
  });
}

function renderMgmt(){
  const list=document.getElementById('mgmt-list');list.innerHTML='';
  members.forEach((name,mi)=>{
    const ac=AVC[mi%AVC.length];const fixed=mi<5;
    const row=document.createElement('div');row.className='mgmt-row';
    const num=document.createElement('span');num.className='mgmt-num';
    num.style.color=ac.fg;num.textContent=mi+1;row.appendChild(num);
    if(fixed){
      const nm=document.createElement('span');
      nm.style.cssText='flex:1;font-size:13px;font-weight:500';nm.textContent=name;
      const tag=document.createElement('span');tag.className='tag tag-fix';tag.textContent='고정';
      row.append(nm,tag);
    }else{
      const inp=document.createElement('input');inp.className='mgmt-inp';inp.value=name;
      inp.onchange=e=>{members[mi]=e.target.value;saveLocal();renderMgmt();renderAll();};
      const tag=document.createElement('span');tag.className='tag tag-sp';tag.textContent='여분';
      const del=document.createElement('button');del.className='del-btn';del.textContent='×';
      del.onclick=()=>{
        if(!confirm(`"${members[mi]}"을 삭제할까요?`))return;
        members.splice(mi,1);
        Object.keys(reports).forEach(k=>{if(reports[k]?.members)reports[k].members.splice(mi,1);});
        saveLocal();renderMgmt();renderAll();
      };
      row.append(inp,tag,del);
    }
    list.appendChild(row);
  });
}

function addMember(){
  members.push('새 멤버');saveLocal();renderMgmt();renderAll();
}

function goWk(wi){
  curWk=wi;sv('hanna_cw',wi);
  switchTab('weekly',document.querySelector('.nav-btn'));renderAll();
}

function switchTab(name,btn){
  ['weekly','summary','personal','members'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===name?'':'none';
  });
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('on',['weekly','summary','personal','members'][i]===name);
  });
  if(name==='summary')renderSummary();
  if(name==='personal')renderPersonal();
  if(name==='members')renderMgmt();
}

function renderAll(){
  renderHeader();renderVerseCard();renderChips();renderReportGrid();
}

// ── Firebase 준비 이벤트 ──────────────────────────────
window.addEventListener('firebase-ready', async ()=>{
  _db=window._db;fbReady=true;
  setSyncDot('ok');

  // 클라우드에서 최신 데이터 불러오기
  try{
    const rSnap=await _db.dbGet('reports');
    const mSnap=await _db.dbGet('meta');
    if(rSnap){reports={...reports,...rSnap};sv('hanna_rp',reports);}
    if(mSnap){
      if(mSnap.members)members=mSnap.members;
      if(mSnap.customRefs)customRefs=mSnap.customRefs;
      sv('hanna_mb',members);sv('hanna_cr',customRefs);
    }
    renderAll();
    showToast('☁️ 클라우드 데이터 불러옴');
  }catch(e){
    showToast('⚠️ 불러오기 실패: '+e.message);
  }

  // 실시간 변경 감지 (다른 기기에서 저장 시 자동 갱신)
  _db.listenReports(data=>{
    const old=JSON.stringify(reports);
    reports={...reports,...data};
    if(JSON.stringify(reports)!==old){
      sv('hanna_rp',reports);renderAll();
      showToast('🔄 다른 기기에서 업데이트됨');
    }
  });
  _db.listenMeta(data=>{
    if(data.members){members=data.members;sv('hanna_mb',members);}
    if(data.customRefs){customRefs=data.customRefs;sv('hanna_cr',customRefs);}
    renderAll();
  });
});

  if(!fbReady){
    setSyncDot('err');
    document.getElementById('sync-dot').title='Firebase 미연결 — 로컬 저장만 가능';
  }
},3000);

renderAll();

// ══ 데이터 내보내기 / 가져오기 / 마이그레이션 ══════════════

// 📤 JSON 파일로 내보내기
function exportData() {
  const payload = {
    exportedAt: new Date().toISOString(),
    version: 1,
    members,
    reports,
    customRefs,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `한나목장_백업_${new Date().toLocaleDateString('ko-KR').replace(/\./g,'').replace(/ /g,'')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ 백업 파일 저장됨');
}

// 📥 JSON 파일 가져오기
function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.reports || !data.members) throw new Error('올바른 백업 파일이 아닙니다');
      if (!confirm(`백업 파일을 가져올까요?\n내보낸 날짜: ${data.exportedAt||'알 수 없음'}\n⚠️ 현재 데이터에 병합됩니다.`)) return;

      // 병합 (기존 + 가져온 데이터)
      reports = { ...reports, ...data.reports };
      members = data.members || members;
      customRefs = { ...customRefs, ...(data.customRefs||{}) };
      saveLocal();

      // Firebase에도 바로 올리기
      if (fbReady) {
        await saveToCloud();
        showToast('✓ 가져오기 완료 — 클라우드에도 동기화됨');
      } else {
        showToast('✓ 가져오기 완료 — 로컬에 저장됨');
      }
      renderAll();
    } catch(err) {
      showToast('⚠️ 오류: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ☁️ 로컬 데이터를 Firebase로 한번에 업로드 (마이그레이션)
async function migrateToCloud() {
  if (!fbReady) {
    showToast('⚠️ Firebase가 연결되지 않았어요. 설정을 먼저 해주세요.');
    return;
  }
  const hasLocal = Object.keys(reports).some(k => reports[k]?.members?.some(m => m.shaum || m.b1));
  if (!hasLocal) {
    showToast('저장된 데이터가 없어요.');
    return;
  }
  if (!confirm('현재 기기의 모든 데이터를 클라우드에 업로드할까요?\n다른 기기에서 접속하면 이 데이터가 보입니다.')) return;
  const ok = await saveToCloud();
  if (ok) showToast('🎉 마이그레이션 완료! 이제 모든 기기에서 동기화돼요.');
}

// ── 마이그레이션 배너 UI ──────────────────────────────

        <div style="font-size:11px;color:#9A7030;margin-top:2px">클라우드에 올리면 모든 기기에서 볼 수 있어요</div>

      <button onclick="document.getElementById('migration-banner').remove()" style="padding:7px 10px;border-radius:8px;border:none;background:none;color:#9A7030;font-size:18px;cursor:pointer;line-height:1;">×</button>

        <div style="font-size:11px;color:var(--ink-f);margin-bottom:10px;line-height:1.6;">

        </div>
        <label style="display:block;width:100%;padding:9px;border-radius:8px;border:1.5px dashed #D4D0C4;background:none;font-size:13px;color:var(--ink-f);cursor:pointer;text-align:center;font-family:inherit;">

          <input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])">

// 멤버 탭 열 때마다 데이터 관리 섹션 추가
const origSwitchTab = switchTab;

  if (name === 'members') renderDataMgmt();
};

// 페이지 로드 시 마이그레이션 배너 표시
